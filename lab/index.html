<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab — Lydia</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

  <!-- GNB -->
  <header class="gnb" id="gnb">
    <div class="gnb__inner">
      <a href="../" class="gnb__logo">Lydia</a>
      <nav class="gnb__nav">
        <a href="../work/">Work</a>
        <a href="../about/">About</a>
        <a href="../lab/">Lab</a>
        <a href="../article/">Article</a>
      </nav>
      <button class="gnb__hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="gnb__mobile-nav" id="mobileNav">
      <a href="../work/">Work</a>
      <a href="../about/">About</a>
      <a href="../lab/">Lab</a>
      <a href="../article/">Article</a>
    </div>
  </header>

  <!-- Page Hero -->
  <div class="page-hero">
    <div class="section__inner">
      <h1 class="page-hero__title reveal">Lab</h1>
      <p class="page-hero__sub reveal">Side projects, motion, and experiments.</p>
    </div>
  </div>

  <!-- Lab Grid -->
  <section class="section">
    <div class="section__inner">
      <div class="work-grid">

        <article class="work-card reveal">
          <div class="work-card__thumb" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)">
          </div>
          <div class="work-card__body">
            <div class="work-card__tags">
              <span class="tag">Motion</span>
              <span class="tag">Award</span>
            </div>
            <h3>모션그래픽 작업</h3>
            <p>어워드 수상 모션 작업물. 추후 업로드 예정.</p>
          </div>
        </article>

        <article class="work-card reveal">
          <div class="work-card__thumb" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%)">
          </div>
          <div class="work-card__body">
            <div class="work-card__tags">
              <span class="tag">Branding</span>
              <span class="tag">Side Project</span>
            </div>
            <h3>사이드 프로젝트</h3>
            <p>실험적 브랜딩 및 비주얼 작업물. 추후 업로드 예정.</p>
          </div>
        </article>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__headline reveal">Let's work together.</p>
      <div class="footer__cta reveal">
        <a href="mailto:ari@memecore.org" class="btn btn--primary">Send Email</a>
        <a href="https://linkedin.com/in/" target="_blank" rel="noopener" class="btn btn--outline">LinkedIn ↗</a>
      </div>
      <p class="footer__copy">© 2025 Lydia</p>
    </div>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
