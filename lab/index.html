    <!-- 3D Motion Graphics — linked with arrow -->

      <h2 class="lab-category__title">3D Motion Graphics</h2>
      <div class="lab-gallery">

          <div class="lab-item__info">
            <span class="tag">Character Animation</span>
            <p class="lab-item__title">Little Detective <span class="lab-item__arrow"><svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9.33333 8C8.59695 8 8 8.59695 8 9.33333C8 10.0697 8.59695 10.6667 9.33333 10.6667H19.4477L8.39052 21.7239C7.86983 22.2446 7.86983 23.0888 8.39052 23.6095C8.91122 24.1302 9.75544 24.1302 10.2761 23.6095L21.3333 12.5523V22.6667C21.3333 23.403 21.9303 24 22.6667 24C23.403 24 24 23.403 24 22.6667V9.33333C24 8.59695 23.403 8 22.6667 8H9.33333Z" fill="currentColor"/></svg></span></p>

            <img src="../assets/images/img--lab-adobe.png" alt="Adobe Creative Cloud" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div class="lab-item__info">
            <span class="tag">Brand Video</span>
            <p class="lab-item__title">Adobe Creative Cloud <span class="lab-item__arrow"><svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9.33333 8C8.59695 8 8 8.59695 8 9.33333C8 10.0697 8.59695 10.6667 9.33333 10.6667H19.4477L8.39052 21.7239C7.86983 22.2446 7.86983 23.0888 8.39052 23.6095C8.91122 24.1302 9.75544 24.1302 10.2761 23.6095L21.3333 12.5523V22.6667C21.3333 23.403 21.9303 24 22.6667 24C23.403 24 24 23.403 24 22.6667V9.33333C24 8.59695 23.403 8 22.6667 8H9.33333Z" fill="currentColor"/></svg></span></p>

        </a>

        <a href="https://www.behance.net/gallery/83513157/Food-Festival" class="lab-item" target="_blank" rel="noopener">

            <img src="../assets/images/img--lab-food.png" alt="Food Festival" style="width:100%;height:100%;object-fit:cover;display:block;">

      <!-- Row 4: 2 items, proportional widths (1:1 + 16:9) -->

        <div class="lab-item" style="flex:1000"><div class="lab-item__thumb" style="aspect-ratio:1/1"><img src="../assets/images/img-lab-line4-1.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div></div>
        <div class="lab-item" style="flex:1775"><div class="lab-item__thumb" style="aspect-ratio:2032/1144"><img src="../assets/images/img-lab-line4-2.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div></div>
      </div>

      <div class="lab-row-flex">
        <div class="lab-item" style="flex:1"><div class="lab-item__thumb" style="aspect-ratio:1560/877"><img src="../assets/images/img-lab-line5-1.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div></div>
        <div class="lab-item" style="flex:1"><div class="lab-item__thumb" style="aspect-ratio:1560/875"><img src="../assets/images/img-lab-line5-2.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div></div>
